services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-dashboard-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_dashboard_hub
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5432:5432"
    volumes:
      - finance_dashboard_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_dashboard_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  finance_dashboard_hub_pgdata:
